<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>My Cart</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>

<body>

    <nav>

        <h2>Cart Assignment</h2>

        <div>

            <button onclick="openProducts()">
                Products
            </button>

            <button onclick="openOrders()">
                My Orders
            </button>

        </div>

    </nav>


    <div class="container">

        <h1>My Cart</h1>

        <p id="message">
            Loading cart...
        </p>

        <div id="cartContainer"></div>

        <button
            id="orderButton"
            onclick="placeOrder()"
        >
            Place Order
        </button>

    </div>


    <script src="cart.js"></script>

</body>

</html>
